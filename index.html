<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NEON RUSH</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080b18;color:#fff;font-family:system-ui;text-align:center}main{max-width:480px;margin:auto;padding:12px}h1{letter-spacing:5px;color:#55f6ff;margin:8px}p{color:#bac7e8;font-size:14px}#stats{display:flex;justify-content:space-around;padding:10px;background:#111a35;border:1px solid #30406e;border-radius:12px}canvas{display:block;width:100%;height:min(68vh,620px);background:#090d20;border:1px solid #30406e;border-radius:12px;touch-action:none;margin-top:10px}button{background:#55f6ff;color:#06101c;border:0;border-radius:10px;padding:13px 22px;font-weight:bold;font-size:16px;margin:8px}#status{min-height:24px;color:#ffd166}
</style>
</head>
<body><main><h1>NEON RUSH</h1><p>Dodge red hazards. Collect gold energy orbs. Survive as long as you can!</p><div id="stats"><span>SCORE <b id="score">0</b></span><span>COINS <b id="coins">0</b></span><span>BEST <b id="best">0</b></span></div><canvas id="game"></canvas><button id="start">START RUN</button><div id="status">Drag to move on mobile · Use ← → or A/D on PC</div></main>
<script>
(()=>{const c=document.getElementById("game"),x=c.getContext("2d"),$=id=>document.getElementById(id);let w=360,h=600,d=1,run=false,last=0,t=0,score=0,coins=0,rocks=[],orbs=[],px=180,py=500,target=180,down=false,keys={},rt=0,ot=0,best=0;try{best=+(localStorage.nrBest||0)}catch(e){}$("best").textContent=best;function resize(){let r=c.getBoundingClientRect();d=Math.min(devicePixelRatio||1,2);w=r.width;h=r.height;c.width=w*d;c.height=h*d;x.setTransform(d,0,0,d,0,0);py=h*.84;draw()}window.addEventListener("resize",resize);function reset(){t=score=coins=0;rocks=[];orbs=[];rt=.3;ot=1;px=target=w/2;py=h*.84;$("score").textContent=0;$("coins").textContent=0;$("status").textContent="Good luck!";}function start(){reset();run=true;$("start").textContent="RESTART";last=performance.now();requestAnimationFrame(loop)}$("start").onclick=start;function end(){run=false;best=Math.max(best,score);try{localStorage.nrBest=best}catch(e){}$("best").textContent=best;$("status").textContent="Game over! Score "+score+" · Coins "+coins;$("start").textContent="PLAY AGAIN"}function hit(a,b){return Math.hypot(a.x-b.x,a.y-b.y)<a.r+b.r}function draw(){x.clearRect(0,0,w,h);let g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,"#080c1c");g.addColorStop(1,"#151d43");x.fillStyle=g;x.fillRect(0,0,w,h);for(let i=0;i<65;i++){x.fillStyle=i%4?"#778bc966":"#55f6ff99";x.fillRect(i*97.3%w,(i*151.7+t*35)%(h+10),2,2)}x.strokeStyle="#25345b";for(let y=(t*45)%40;y<h;y+=40){x.beginPath();x.moveTo(0,y);x.lineTo(w,y);x.stroke()}for(let a of rocks){x.save();x.translate(a.x,a.y);x.rotate(a.rot);x.shadowBlur=15;x.shadowColor="#ff397e";x.fillStyle="#ff397e";x.beginPath();for(let i=0;i<8;i++){let r=i%2?a.r*.7:a.r,ang=i*Math.PI/4;i?x.lineTo(Math.cos(ang)*r,Math.sin(ang)*r):x.moveTo(Math.cos(ang)*r,Math.sin(ang)*r)}x.closePath();x.fill();x.restore()}for(let o of orbs){x.shadowBlur=16;x.shadowColor="#ffd166";x.fillStyle="#ffd166";x.beginPath();x.arc(o.x,o.y,o.r,0,7);x.fill()}x.shadowBlur=20;x.shadowColor="#55f6ff";x.fillStyle="#55f6ff";x.beginPath();x.moveTo(px,py-17);x.lineTo(px+12,py+12);x.lineTo(px,py+6);x.lineTo(px-12,py+12);x.closePath();x.fill();x.shadowBlur=0}function loop(now){if(!run)return;let dt=Math.min((now-last)/1000,.035);last=now;t+=dt;if(down)px+=(target-px)*Math.min(1,dt*14);else{if(keys.ArrowLeft||keys.a||keys.A)px-=260*dt;if(keys.ArrowRight||keys.d||keys.D)px+=260*dt}px=Math.max(14,Math.min(w-14,px));rt-=dt;ot-=dt;if(rt<=0){let r=12+Math.random()*10;rocks.push({x:r+Math.random()*(w-2*r),y:-r,r,v:160+Math.min(t*4,220),rot:Math.random()*6});rt=Math.max(.28,.75-t*.007)+Math.random()*.2}if(ot<=0){orbs.push({x:15+Math.random()*(w-30),y:-10,r:7,v:130+t*2});ot=1+Math.random()*1.2}for(let a of rocks){a.y+=a.v*dt;a.rot+=dt;if(hit({x:px,y:py,r:11},a)){draw();end();return}}for(let i=rocks.length-1;i>=0;i--)if(rocks[i].y>h+30)rocks.splice(i,1);for(let i=orbs.length-1;i>=0;i--){let o=orbs[i];o.y+=o.v*dt;if(hit({x:px,y:py,r:14},o)){coins++;orbs.splice(i,1);$("coins").textContent=coins}else if(o.y>h+20)orbs.splice(i,1)}score=Math.floor(t*10)+coins*25;$("score").textContent=score;draw();if(run)requestAnimationFrame(loop)}function pos(e){let r=c.getBoundingClientRect();target=e.clientX-r.left}c.addEventListener("pointerdown",e=>{down=true;pos(e);c.setPointerCapture(e.pointerId)});c.addEventListener("pointermove",e=>{if(down)pos(e)});c.addEventListener("pointerup",()=>down=false);c.addEventListener("pointercancel",()=>down=false);window.addEventListener("keydown",e=>{keys[e.key]=true;if(["ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();if(!run&&(e.key===" "||e.key==="Enter"))start()});window.addEventListener("keyup",e=>keys[e.key]=false);resize();px=w/2;draw()})();
</script></body></html>
