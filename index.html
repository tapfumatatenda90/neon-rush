<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080b18">
<title>NEON RUSH</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080b18;color:#f5f7ff;font-family:system-ui,sans-serif;text-align:center}main{max-width:520px;margin:auto;padding:14px}h1{letter-spacing:5px;color:#55f6ff;font-size:clamp(28px,8vw,42px)}p{color:#bac7e8;font-size:14px;line-height:1.45}.stats{display:flex;justify-content:space-around;gap:4px;padding:11px 4px;background:#111a35;border:1px solid #30406e;border-radius:12px;font-size:12px}.stats b{color:#55f6ff}canvas{display:block;width:100%;height:min(60vh,600px);background:#090d20;border:1px solid #30406e;border-radius:12px;touch-action:none;margin-top:10px}button{background:#55f6ff;color:#06101c;border:0;border-radius:11px;padding:12px 15px;font-weight:800;font-size:14px;margin:5px;cursor:pointer}.secondary{background:#192344;color:#eef4ff;border:1px solid #344875}.row{display:flex;justify-content:center;flex-wrap:wrap}.panel{background:#101832;border:1px solid #30406e;border-radius:14px;padding:12px;margin:12px 0}.hidden{display:none}.ship{display:inline-block;width:44%;margin:5px;padding:10px 4px;background:#0b1229;border:1px solid #30406e;border-radius:12px}.swatch{font-size:28px}.muted{color:#9caedb;font-size:12px}#status{min-height:25px;color:#ffd166;font-size:13px}
</style>
</head>
<body><main>
<h1>NEON RUSH</h1><p>Dodge red hazards. Collect gold orbs. Unlock your fleet!</p>
<div class="stats"><span>SCORE <b id="score">0</b></span><span>RUN <b id="runcoins">0</b></span><span>WALLET <b id="wallet">0</b></span><span>BEST <b id="best">0</b></span></div>
<canvas id="game"></canvas>
<div class="row"><button id="start">START RUN</button><button class="secondary" id="shopbtn">SHIP SHOP</button></div>
<div id="status">Drag to move · PC: ← → or A/D</div>
<section id="shop" class="panel hidden"><h2>SHIP SHOP</h2><p>Spend coins earned in runs to unlock ships.</p><div id="ships"></div><button class="secondary" id="close">BACK TO GAME</button></section>
<p class="muted">Wallet, ships and best score save on this device.</p>
</main>
<script>
(()=>{
const c=document.getElementById("game"),x=c.getContext("2d"),$=id=>document.getElementById(id);
const fleet=[{name:"Pulse",color:"#55f6ff",price:0},{name:"Nova",color:"#ff4fa3",price:100},{name:"Solar",color:"#ffd166",price:250},{name:"Phantom",color:"#b69cff",price:500}];
function load(k,d){try{let v=localStorage.getItem("nr2_"+k);return v===null?d:JSON.parse(v)}catch(e){return d}}
function save(k,v){try{localStorage.setItem("nr2_"+k,JSON.stringify(v))}catch(e){}}
let wallet=load("wallet",0),unlocked=load("unlocked",[0]),selected=load("selected",0),best=load("best",0);
if(!Array.isArray(unlocked))unlocked=[0];if(!unlocked.includes(0))unlocked.push(0);if(!fleet[selected]||!unlocked.includes(selected))selected=0;
let w=360,h=580,d=1,run=false,last=0,t=0,score=0,runCoins=0,rocks=[],orbs=[],px=180,py=480,target=180,down=false,keys={},rt=0,ot=0;
function ui(){$("wallet").textContent=wallet;$("best").textContent=best;$("score").textContent=score;$("runcoins").textContent=runCoins}
function shopRender(){let root=$("ships");root.innerHTML="";fleet.forEach((s,i)=>{let card=document.createElement("div");card.className="ship";let owned=unlocked.includes(i);card.innerHTML='<div class="swatch" style="color:'+s.color+'">▲</div><strong>'+s.name+'</strong><div class="muted">'+(owned?(selected===i?"EQUIPPED":"UNLOCKED"):s.price+" coins")+'</div>';let b=document.createElement("button");b.className="secondary";b.textContent=owned?(selected===i?"Equipped":"Equip"):"Unlock";b.onclick=()=>{if(owned){selected=i;save("selected",i);$("status").textContent=s.name+" equipped."}else if(wallet>=s.price){wallet-=s.price;unlocked.push(i);selected=i;save("wallet",wallet);save("unlocked",unlocked);save("selected",i);$("status").textContent=s.name+" unlocked!"}else{$("status").textContent="Need "+(s.price-wallet)+" more coins."}ui();shopRender()};card.appendChild(b);root.appendChild(card)})}
function resize(){let r=c.getBoundingClientRect();d=Math.min(devicePixelRatio||1,2);w=r.width;h=r.height;c.width=w*d;c.height=h*d;x.setTransform(d,0,0,d,0,0);py=h*.84;draw()}window.addEventListener("resize",resize);
function reset(){t=score=runCoins=0;rocks=[];orbs=[];rt=.35;ot=.9;px=target=w/2;py=h*.84;ui();$("status").textContent="Collect coins to unlock ships!"}
function start(){$("shop").classList.add("hidden");reset();run=true;$("start").textContent="RESTART";last=performance.now();requestAnimationFrame(loop)}$("start").onclick=start;
$("shopbtn").onclick=()=>{run=false;$("shop").classList.remove("hidden");shopRender();$("status").textContent="Choose a ship to equip or unlock."};$("close").onclick=()=>{$("shop").classList.add("hidden");draw()};
function end(){run=false;best=Math.max(best,score);save("best",best);ui();$("status").textContent="Game over! Score "+score+" · Coins banked: "+runCoins;$("start").textContent="PLAY AGAIN"}
function hit(a,b){return Math.hypot(a.x-b.x,a.y-b.y)<a.r+b.r}
function draw(){x.clearRect(0,0,w,h);let g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,"#080c1c");g.addColorStop(1,"#151d43");x.fillStyle=g;x.fillRect(0,0,w,h);for(let i=0;i<65;i++){x.fillStyle=i%4?"#778bc966":"#55f6ff99";x.fillRect(i*97.3%w,(i*151.7+t*35)%(h+10),2,2)}x.strokeStyle="#25345b";for(let y=t*45%40;y<h;y+=40){x.beginPath();x.moveTo(0,y);x.lineTo(w,y);x.stroke()}for(let a of rocks){x.save();x.translate(a.x,a.y);x.rotate(a.rot);x.shadowBlur=15;x.shadowColor="#ff397e";x.fillStyle="#ff397e";x.beginPath();for(let i=0;i<8;i++){let r=i%2?a.r*.7:a.r,ang=i*Math.PI/4;i?x.lineTo(Math.cos(ang)*r,Math.sin(ang)*r):x.moveTo(Math.cos(ang)*r,Math.sin(ang)*r)}x.closePath();x.fill();x.restore()}for(let o of orbs){x.shadowBlur=16;x.shadowColor="#ffd166";x.fillStyle="#ffd166";x.beginPath();x.arc(o.x,o.y,o.r,0,Math.PI*2);x.fill()}let color=fleet[selected].color;x.shadowBlur=20;x.shadowColor=color;x.fillStyle=color;x.beginPath();x.moveTo(px,py-17);x.lineTo(px+12,py+12);x.lineTo(px,py+6);x.lineTo(px-12,py+12);x.closePath();x.fill();x.shadowBlur=0}
function loop(now){if(!run)return;let dt=Math.min((now-last)/1000,.035);last=now;t+=dt;if(down)px+=(target-px)*Math.min(1,dt*14);else{if(keys.ArrowLeft||keys.a||keys.A)px-=260*dt;if(keys.ArrowRight||keys.d||keys.D)px+=260*dt}px=Math.max(14,Math.min(w-14,px));rt-=dt;ot-=dt;if(rt<=0){let r=12+Math.random()*10;rocks.push({x:r+Math.random()*(w-2*r),y:-r,r,v:160+Math.min(t*4,220),rot:Math.random()*6});rt=Math.max(.28,.75-t*.007)+Math.random()*.2}if(ot<=0){orbs.push({x:15+Math.random()*(w-30),y:-10,r:7,v:130+Math.min(t*2,150)});ot=1+Math.random()*1.2}for(let a of rocks){a.y+=a.v*dt;a.rot+=dt;if(hit({x:px,y:py,r:11},a)){draw();end();return}}for(let i=rocks.length-1;i>=0;i--)if(rocks[i].y>h+30)rocks.splice(i,1);for(let i=orbs.length-1;i>=0;i--){let o=orbs[i];o.y+=o.v*dt;if(hit({x:px,y:py,r:14},o)){runCoins++;wallet++;save("wallet",wallet);orbs.splice(i,1);ui()}else if(o.y>h+20)orbs.splice(i,1)}score=Math.floor(t*10)+runCoins*25;ui();draw();if(run)requestAnimationFrame(loop)}
function pos(e){target=e.clientX-c.getBoundingClientRect().left}c.addEventListener("pointerdown",e=>{down=true;pos(e);c.setPointerCapture(e.pointerId)});c.addEventListener("pointermove",e=>{if(down)pos(e)});c.addEventListener("pointerup",()=>down=false);c.addEventListener("pointercancel",()=>down=false);
window.addEventListener("keydown",e=>{keys[e.key]=true;if(["ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();if(!run&&(e.key===" "||e.key==="Enter"))start()});window.addEventListener("keyup",e=>keys[e.key]=false);
ui();shopRender();resize();px=w/2;draw();
})();
</script></body></html>
